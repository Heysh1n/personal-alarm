[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-tui"
version = "1.0.0"
description = "Modular Linux TUI alarm clock with sleep cycles, bedtime check, sleep inhibition, and gradual volume ramp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
alarm-tui = "alarm_tui.cli:main"

[tool.setuptools]
packages = ["alarm_tui"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
